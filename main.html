<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="voiceinator">

    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">Pitch:</label>
    <input name="pitch" type="range" min="0" max="2" value="1" step="0.1">

    <textarea name="text">Hello! I love JavaScript 👍</textarea>

    <button id="stop">Stop!</button>
    <button id="speak">Speak</button>

  </div>

<script>

const msg = new SpeechSynthesisUtterance();

let voices = [];

const voicesDropdown = document.querySelector('[name="voice"]');
const options = document.querySelectorAll('[type="range"], [name="text"]');
const speakButton = document.querySelector('#speak');
const stopButton = document.querySelector('#stop');


// Check whether Speech Synthesis is supported
function speechSynthesisSupported() {

  if (!('speechSynthesis' in window)) {

    voicesDropdown.innerHTML = '';

    const option = document.createElement('option');

    option.textContent = 'No voices available';

    voicesDropdown.appendChild(option);

    return false;
  }

  return true;
}


// Populate voices
function populateVoices() {

  if (!speechSynthesisSupported()) {
    return;
  }

  voices = speechSynthesis.getVoices();

  voicesDropdown.innerHTML = '';

  if (voices.length === 0) {

    const option = document.createElement('option');

    option.value = '';

    option.textContent = 'No voices available';

    voicesDropdown.appendChild(option);

    return;
  }

  voices.forEach(function(voice) {

    const option = document.createElement('option');

    option.value = voice.name;

    option.textContent = `${voice.name} (${voice.lang})`;

    voicesDropdown.appendChild(option);

  });

  msg.voice = voices[0];

}


// Initial voice loading
populateVoices();


// Load voices when they become available
if ('speechSynthesis' in window) {

  speechSynthesis.addEventListener(
    'voiceschanged',
    populateVoices
  );

}


// Set selected voice
function setVoices() {

  const selectedVoice = voices.find(function(voice) {

    return voice.name === voicesDropdown.value;

  });

  if (selectedVoice) {

    msg.voice = selectedVoice;

  }

}


// Set rate, pitch and text
function setOptions() {

  const rate = document.querySelector('[name="rate"]').value;

  const pitch = document.querySelector('[name="pitch"]').value;

  const text = document.querySelector('[name="text"]').value;

  msg.rate = Number(rate);

  msg.pitch = Number(pitch);

  msg.text = text;

}


// Speak
function speak() {

  // Check API support first
  if (!speechSynthesisSupported()) {

    return;

  }

  const text = document.querySelector('[name="text"]').value;

  // Prevent speech when text is empty
  if (!text || text.trim() === '') {

    alert('Please enter some text');

    return;

  }

  setOptions();

  setVoices();

  speechSynthesis.cancel();

  speechSynthesis.speak(msg);

}


// Stop
function stop() {

  if ('speechSynthesis' in window) {

    speechSynthesis.cancel();

  }

}


// Speak button
speakButton.addEventListener(
  'click',
  speak
);


// Stop button
stopButton.addEventListener(
  'click',
  stop
);


// Voice change
voicesDropdown.addEventListener(
  'change',
  function() {

    setVoices();

    if (speechSynthesis.speaking) {

      speechSynthesis.cancel();

      speechSynthesis.speak(msg);

    }

  }
);


// Rate, pitch and text changes
options.forEach(function(option) {

  option.addEventListener(
    'input',
    function() {

      setOptions();

    }

  );

});

</script>

</body>
</html>
